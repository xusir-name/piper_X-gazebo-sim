default_acceleration_scaling_factor: 0.3

joint_limits:
  joint1: {has_velocity_limits: true, max_velocity: 5.0, has_acceleration_limits: true, max_acceleration: 5.0}
  joint2: {has_velocity_limits: true, max_velocity: 5.0, has_acceleration_limits: true, max_acceleration: 5.0}
  joint3: {has_velocity_limits: true, max_velocity: 5.0, has_acceleration_limits: true, max_acceleration: 5.0}
  joint4: {has_velocity_limits: true, max_velocity: 5.0, has_acceleration_limits: true, max_acceleration: 8.0}
  joint5: {has_velocity_limits: true, max_velocity: 5.0, has_acceleration_limits: true, max_acceleration: 8.0}
  joint6: {has_velocity_limits: true, max_velocity: 5.0, has_acceleration_limits: true, max_acceleration: 8.0}
  gripper_joint1: {has_velocity_limits: true, max_velocity: 3.0, has_acceleration_limits: true, max_acceleration: 5.0}
  gripper_joint2: {has_velocity_limits: true, max_velocity: 3.0, has_acceleration_limits: true, max_acceleration: 5.0}
